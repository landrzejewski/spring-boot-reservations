spring:
  application:
    name: hotel
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:postgresql://localhost:5432/hotel
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 6
  messages:
    fallback-to-system-locale: false
logging:
  level:
    org.springframework: info
hotel:
  room-numbers:
    rooms-per-floor: 10
    suite-start-number: 900
  stay-policy:
    max-nights: 14
management:
  endpoints:
    web:
      exposure:
        include: health,info
