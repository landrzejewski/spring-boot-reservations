spring:
  application:
    name: hotel
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:postgresql://localhost:5432/hotel
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 6
  mongodb:
    username: admin
    password: admin
    database: hotel
    authentication-database: admin
logging:
  level:
    org.springframework: info
hotel:
  room-numbers:
    rooms-per-floor: 10
    suite-start-number: 900
  stay-policy:
    max-nights: 14
